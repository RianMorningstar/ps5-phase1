<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P3 v19</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
</head>
<body>
<h3 id="st">wasm probe</h3>
<pre id="out"></pre>
<script>
// v19: WebAssembly availability on 14.23. If Wasm works, CVE-2026-113903
// (tail-call + memory.grow stale-base write, fixed Safari 27.2 = after the
// 14.23 cutoff) becomes the primary entry candidate with a known trigger.
function log(s) { document.getElementById('out').textContent += s + "\n"; }

log('PAGE VERSION: v19 (WebAssembly probe)');
log('UA = ' + navigator.userAgent);
log('typeof WebAssembly = ' + typeof WebAssembly);

if (typeof WebAssembly === 'undefined') {
  log('NO WebAssembly - CVE-2026-113903 unreachable, stays 14.10-like');
} else {
  // minimal module: (module (func (export "f") (result i32) i32.const 42))
  var bytes = new Uint8Array([
    0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
    0x01, 0x05, 0x01, 0x60, 0x00, 0x01, 0x7f,
    0x03, 0x02, 0x01, 0x00,
    0x07, 0x05, 0x01, 0x01, 0x66, 0x00, 0x00,
    0x0a, 0x06, 0x01, 0x04, 0x00, 0x41, 0x2a, 0x0b
  ]);
  WebAssembly.instantiate(bytes).then(function (r) {
    var v = r.instance.exports.f();
    log('instantiated OK, f() = ' + v + (v === 42 ? ' (correct)' : ' (WRONG)'));
    log('=> WASM AVAILABLE on 14.23 - CVE-2026-113903 is the primary candidate');
    log('   next: port JSTests/wasm/stress/tail-call-same-instance-js-import-memory-grow.js');
  }, function (e) {
    log('instantiate FAILED: ' + e);
    log('=> Wasm present but broken/limited - inspect error');
  });
}

log('typeof WebAssembly.Memory = ' + (typeof WebAssembly !== 'undefined' ? typeof WebAssembly.Memory : 'n/a'));
try { log('new WebAssembly.Memory({initial:1}).buffer.byteLength = ' +
    (typeof WebAssembly !== 'undefined' ? new WebAssembly.Memory({initial:1}).buffer.byteLength : 'n/a')); }
catch (e) { log('Memory FAILED: ' + e); }
</script>
</body>
</html>
